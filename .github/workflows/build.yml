name: YTKACE + RYD

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Install tools
        run: |
          brew install make ldid dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Setup Theos
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Build Return YouTube Dislike
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          git -C sdks sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git -C sdks checkout
          mv sdks/*.sdk "$THEOS/sdks"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git
          make -C Return-YouTube-Dislikes package DEBUG=0 FINALPACKAGE=1
          mv Return-YouTube-Dislikes/packages/*.deb ryd.deb

      - name: Download latest YTKACE IPAs
        run: |
          tag=$(gh release view -R itzzace/ytkace --json tagName -q .tagName)
          echo "YTKACE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R itzzace/ytkace -p 'YTKACE_*.ipa'

      - name: Inject RYD
        run: |
          for ipa in YTKACE_*.ipa; do
            out="${ipa%.ipa}_RYD.ipa"
            cyan -i "$ipa" -o "$out" -s -f ryd.deb
            rm -rf chk && unzip -q "$out" -d chk
            test -d chk/Payload/*.app/RYD.bundle
            libs=$(otool -L chk/Payload/*.app/YouTube)
            echo "$libs" | grep -E 'YTKACE|Dislikes'
            [[ $libs == *YTKACE.dylib* && $libs == *YouTubeDislikesReturn.dylib* ]]
          done

      - name: Draft release
        run: >-
          gh release create "build-${{ github.run_number }}" *_RYD.ipa --draft
          -R "$GITHUB_REPOSITORY" --title "YTKACE $YTKACE_TAG + RYD"
          --notes "YTKACE $YTKACE_TAG with Return YouTube Dislike injected."
